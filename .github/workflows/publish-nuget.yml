name: Publish Nuget Package

on:
  release:
    types: [published]
  workflow_dispatch: 

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions: 
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build JustSomeLogging/JustSomeLogging.csproj --configuration Release

      - name: Pack
        run: dotnet pack JustSomeLogging/JustSomeLogging.csproj --configuration Release --no-build --output ./packages

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: BigTylis

      - name: NuGet push
        run: |
          dotnet nuget push "./packages/*.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source "https://api.nuget.org/v3/index.json" \
          --skip-duplicate
